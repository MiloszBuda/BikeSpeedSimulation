name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend application
        working-directory: ./frontend
        env:
          VITE_API_URL: https://bikespeedsimulation.onrender.com
          VITE_CARTO_API_KEY: ${{ vars.VITE_CARTO_API_KEY || vars.VITE_CARTO_AI_KEY || vars.CARTO_API_KEY || vars.CARTO_AI_KEY || vars.vite_carto_api_key || vars.vite_carto_ai_key || vars.carto_api_key || vars.carto_ai_key || secrets.VITE_CARTO_API_KEY || secrets.VITE_CARTO_AI_KEY || secrets.CARTO_API_KEY || secrets.CARTO_AI_KEY }}
          VITE_CARTO_AI_KEY: ${{ vars.VITE_CARTO_AI_KEY || vars.vite_carto_ai_key || vars.VITE_CARTO_API_KEY }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
